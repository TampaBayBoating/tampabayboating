<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1a2f">
<title>Bay Arcade | Tampa Bay Boating</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0a1a2f; overflow:hidden; touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; }
  canvas { display:block; border-radius:12px; box-shadow:0 8px 40px rgba(0,0,0,.5); touch-action:none; }
  #back { position:absolute; top:10px; left:10px; z-index:5; background:rgba(6,20,38,.72); color:#cfe8ff;
    border:1px solid rgba(140,200,255,.35); border-radius:20px; padding:8px 14px; font-size:14px;
    text-decoration:none; backdrop-filter:blur(4px); }
</style>
</head>
<body>
<div id="wrap">
  <a id="back" href="index.html">‹ Tampa Bay Boating</a>
  <canvas id="game" width="480" height="720"></canvas>
</div>
<script>
"use strict";
/* BAY ARCADE — Tampa Bay Boating mini-games: docking, racing, fishing. */
const W = 480, H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() {
  const pad = 8;
  const s = Math.min((innerWidth - pad*2) / W, (innerHeight - pad*2) / H);
  canvas.style.width = (W*s) + 'px';
  canvas.style.height = (H*s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- audio ---------- */
let AC = null;
function beep(freq, dur, type, vol, when) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .1, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch(e) {}
}
const sndGate = () => { beep(880,.1,'sine',.09); beep(1320,.14,'sine',.07,.08); };
const sndHit  = () => beep(130,.25,'sawtooth',.13);
const sndDock = () => { beep(523,.12,'triangle',.11); beep(659,.12,'triangle',.11,.1); beep(784,.22,'triangle',.11,.2); };
const sndOver = () => { beep(330,.2,'triangle',.11); beep(220,.35,'triangle',.11,.18); };
const sndSplash = () => beep(300,.15,'sine',.09);
const sndCatch  = () => { beep(660,.1,'square',.07); beep(880,.16,'square',.07,.09); };
const sndCount  = () => beep(440,.12,'square',.09);
const sndGo     = () => beep(880,.3,'square',.1);

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : +v; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
};

/* ---------- utils ---------- */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* ---------- input: keys + multi-touch buttons ---------- */
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
  uiTap(null);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const keyDown = (...ns) => ns.some(n => keys[n]);

const pointers = new Map();   // pointerId -> button id
let uiButtons = [];           // rebuilt every frame during draw
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H };
}
function hitBtn(p) {
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (b.c) { if (Math.hypot(p.x - b.x, p.y - b.y) <= b.r) return b; }
    else if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b;
  }
  return null;
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
  const p = toGame(e);
  const b = hitBtn(p);
  if (b) { pointers.set(e.pointerId, b.id); if (b.tap) b.tap(p); }
  else { pointers.set(e.pointerId, 'tap'); uiTap(p); }
});
canvas.addEventListener('pointerup', e => { pointers.delete(e.pointerId); });
canvas.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); });
function held(id) { for (const v of pointers.values()) if (v === id) return true; return false; }
function driveInput() {
  return {
    left:  held('sl') || keyDown('arrowleft','a'),
    right: held('sr') || keyDown('arrowright','d'),
    fwd:   held('fw') || keyDown('arrowup','w'),
    rev:   held('rv') || keyDown('arrowdown','s')
  };
}

/* ---------- shared physics ---------- */
function driveBoat(b, dt, ctl, maxF, maxR) {
  const ACC = 230, RACC = 170, DRAG = 150;
  if (ctl.fwd) b.sp = Math.min(maxF, b.sp + ACC*dt);
  else if (ctl.rev) b.sp = Math.max(-maxR, b.sp - RACC*dt);
  else if (b.sp > 0) b.sp = Math.max(0, b.sp - DRAG*dt);
  else b.sp = Math.min(0, b.sp + DRAG*dt);
  const grip = Math.min(1, Math.abs(b.sp) / 70);
  const tr = 3.1 * grip * (b.sp < -1 ? -1 : 1);
  if (ctl.left) b.a -= tr*dt;
  if (ctl.right) b.a += tr*dt;
  b.x += Math.cos(b.a) * b.sp * dt;
  b.y += Math.sin(b.a) * b.sp * dt;
}
function makeWake() { return []; }
function pushWake(w, x, y, sp) {
  if (Math.abs(sp) > 30 && Math.random() < .6)
    w.push({ x:x + (Math.random()-.5)*10, y:y + (Math.random()-.5)*10, l:1 });
  for (const p of w) p.l -= .03;
  return w.filter(p => p.l > 0);
}

/* ---------- drawing: water, boats, props ---------- */
let waveT = 0;
const foamDots = [];
for (let i = 0; i < 80; i++) foamDots.push({ x:Math.random()*W, y:Math.random()*H, s:1+Math.random()*2, v:5+Math.random()*9 });

function drawWater() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0e2f52'); g.addColorStop(.5, '#11416e'); g.addColorStop(1, '#0b2a49');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let k = 0; k < 5; k++) {
    ctx.strokeStyle = 'rgba(130,195,245,' + (.075 - k*.012).toFixed(3) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const yb = ((k*175 + waveT*15) % (H+140)) - 70;
    for (let x = 0; x <= W; x += 10) {
      const y = yb + Math.sin(x*.025 + waveT*1.1 + k*1.7) * 10;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(200,230,250,.18)';
  for (const d of foamDots) {
    const y = (d.y + waveT*d.v) % H;
    ctx.fillRect(d.x, y, d.s, d.s);
  }
}
function drawWake(w) {
  for (const p of w) {
    ctx.fillStyle = 'rgba(190,225,250,' + (p.l*.4).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, 9*(1-p.l)+3, 0, 7); ctx.fill();
  }
}
function drawBoat(b, color) {
  ctx.save();
  ctx.translate(b.x, b.y + Math.sin(waveT*3 + b.x*.05) * 1.4);
  ctx.rotate(b.a + Math.PI/2);
  if (b.flash && Math.floor(waveT*12) % 2 === 0) ctx.globalAlpha = .35;
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  rr(-14, -24, 28, 52, 12); ctx.fill();
  const g = ctx.createLinearGradient(-14, 0, 14, 0);
  g.addColorStop(0, '#d7e2ec'); g.addColorStop(.5, '#ffffff'); g.addColorStop(1, '#c2d2e2');
  ctx.fillStyle = g; rr(-13, -25, 26, 50, 11); ctx.fill();
  ctx.fillStyle = color; ctx.fillRect(-13, -3, 26, 5);           // sheer stripe
  ctx.fillStyle = '#edf2f7'; rr(-9, -23, 18, 11, 6); ctx.fill();  // bow deck
  ctx.fillStyle = '#274b6b'; rr(-8, -9, 16, 13, 4); ctx.fill();   // console
  const wg = ctx.createLinearGradient(0, -8, 0, 1);
  wg.addColorStop(0, 'rgba(185,228,252,.95)'); wg.addColorStop(1, 'rgba(120,180,220,.5)');
  ctx.fillStyle = wg; rr(-7, -8, 14, 8, 3); ctx.fill();          // windshield
  ctx.fillStyle = '#1c2b3a'; rr(-5, 25, 10, 9, 3); ctx.fill();    // outboard
  ctx.fillStyle = '#0e141c'; ctx.fillRect(-2, 30, 4, 6);
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawBuoy(x, y, color) {
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(x+2, y+5, 10, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(x-9, y-3, 18, 5);
  if (Math.floor(waveT*2 + x) % 2 === 0) {
    ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(x, y-12, 3, 0, 7); ctx.fill();
  }
}
function vignette() {
  const g = ctx.createRadialGradient(W/2, H/2, H*.32, W/2, H/2, H*.72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.32)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
/* drive control buttons (dock + race) */
function drawControls() {
  const defs = [
    { id:'sl', x:66,  y:660, r:40, t:'◀' },
    { id:'sr', x:158, y:660, r:40, t:'▶' },
    { id:'fw', x:414, y:604, r:36, t:'▲' },
    { id:'rv', x:414, y:680, r:36, t:'▼' }
  ];
  for (const d of defs) {
    uiButtons.push({ id:d.id, c:1, x:d.x, y:d.y, r:d.r });
    const on = held(d.id);
    ctx.fillStyle = on ? 'rgba(143,208,240,.85)' : 'rgba(10,30,52,.62)';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(143,208,240,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.stroke();
    ctx.fillStyle = on ? '#0a2540' : '#cfe8ff';
    ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.t, d.x, d.y + 1);
    ctx.textBaseline = 'alphabetic';
  }
  ctx.fillStyle = 'rgba(207,232,255,.55)'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('STEER', 112, 716); ctx.fillText('THROTTLE', 414, 724 - 4);
}
function overlay(title, lines, cta) {
  ctx.fillStyle = 'rgba(4,12,24,.8)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 40px sans-serif';
  ctx.fillText(title, W/2, H/2 - 120);
  ctx.fillStyle = '#dceefc'; ctx.font = '17px sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, W/2, H/2 - 60 + i*28));
  const pulse = .6 + .4*Math.sin(waveT*5);
  ctx.fillStyle = 'rgba(125,255,170,' + pulse.toFixed(2) + ')';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText(cta, W/2, H/2 + 118);
}

/* ================= GAME MODES ================= */
let mode = 'menu';
let ovl = null;   // {title, lines, cta, next}
function ord(n) { return n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : '4th'; }

/* ---------- MENU ---------- */
const menuBtns = [
  { id:'m-dock', y:300, ico:'\u2693', t:'Docking Challenge', s:'Thread the buoys, nail the slip' },
  { id:'m-race', y:405, ico:'\uD83C\uDFC1', t:'Speedboat Race', s:'2 laps against 3 rivals' },
  { id:'m-fish', y:510, ico:'\uD83C\uDFA3', t:'Fishing', s:'Cast, hook, and reel \u2019em in' }
];
function menuDraw() {
  drawWater();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 50px sans-serif';
  ctx.fillText('BAY ARCADE', W/2, 148);
  ctx.fillStyle = '#9fc3e0'; ctx.font = '16px sans-serif';
  ctx.fillText('Tampa Bay Boating mini-games', W/2, 180);
  for (const b of menuBtns) {
    uiButtons.push({ id:b.id, x:W/2-160, y:b.y-36, w:320, h:78, tap:() => selectMode(b.id) });
    const g = ctx.createLinearGradient(0, b.y-36, 0, b.y+42);
    g.addColorStop(0, '#17486f'); g.addColorStop(1, '#0d2c4b');
    ctx.fillStyle = g; rr(W/2-160, b.y-36, 320, 78, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(143,208,240,.5)'; ctx.lineWidth = 2;
    rr(W/2-160, b.y-36, 320, 78, 14); ctx.stroke();
    ctx.textAlign = 'left'; ctx.font = '32px sans-serif';
    ctx.fillText(b.ico, W/2-142, b.y+12);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 19px sans-serif';
    ctx.fillText(b.t, W/2-94, b.y-2);
    ctx.fillStyle = '#9fc3e0'; ctx.font = '13px sans-serif';
    ctx.fillText(b.s, W/2-94, b.y+20);
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#7d99b5'; ctx.font = '13px sans-serif';
  const bd = store.get('tbb-best-dock', 0), br = store.get('tbb-best-race', 0), bf = store.get('tbb-best-fish', 0);
  ctx.fillText('Bests \u2014 Dock: ' + (bd || '\u2014') + ' pts    Race: ' + (br ? ord(br) : '\u2014') + '    Fish: ' + (bf || '\u2014') + ' pts', W/2, 624);
  vignette();
}
function selectMode(id) {
  sndGo();
  if (id === 'm-dock') dockStart();
  else if (id === 'm-race') raceStart();
  else if (id === 'm-fish') fishStart();
}

/* ---------- DOCKING ---------- */
const DOCK_Y = 96, NOWAKE_Y = 250;
const dock = { level:1, hull:3, score:0, startT:0, g:0, invuln:0, shake:0, slip:{cx:240, w:112}, boats:[], gatesArr:[] };
const dboat = { x:240, y:630, a:-Math.PI/2, sp:0, wake:[] };
function dockNewLevel() {
  dock.slip.w = Math.max(64, 112 - (dock.level-1)*9);
  dock.slip.cx = 130 + Math.random()*(W-260);
  dock.boats = [];
  const n = Math.min(2 + dock.level, 6);
  for (let i = 0; i < n; i++) {
    let x, y, ok, tries = 0;
    do {
      ok = true;
      x = 50 + Math.random()*(W-100); y = 210 + Math.random()*(H-360);
      if (Math.abs(x - W/2) < 70 && y > H-280) ok = false;
      for (const b of dock.boats) if (Math.hypot(b.x-x, b.y-y) < 115) ok = false;
      tries++;
    } while (!ok && tries < 40);
    dock.boats.push({ x, y, r:24 + Math.random()*8 });
  }
  dock.gatesArr = [];
  for (let i = 0; i < 3; i++) dock.gatesArr.push({ x:110 + Math.random()*(W-220), y:560 - i*130, w:120, passed:false });
  dboat.x = W/2; dboat.y = 630; dboat.a = -Math.PI/2; dboat.sp = 0; dboat.wake = [];
  dock.invuln = 0;
}
function dockStart() {
  mode = 'dock'; dock.level = 1; dock.hull = 3; dock.score = 0; dock.g = 0;
  dock.startT = performance.now(); dockNewLevel();
}
function dockHit() {
  if (dock.invuln > 0) return;
  dock.hull--; dock.invuln = 1.2; dock.shake = 1; sndHit();
  dboat.y = Math.min(H-40, dboat.y + 50);
  dboat.a = -Math.PI/2 + (Math.random()-.5)*.4; dboat.sp = 0;
  if (dock.hull <= 0) {
    const best = store.get('tbb-best-dock', 0);
    if (dock.score > best) store.set('tbb-best-dock', dock.score);
    sndOver();
    ovl = { title:'HULL BREACHED!', lines:['The dock wins this round.', 'Score: ' + dock.score + ' pts',
      'Best: ' + store.get('tbb-best-dock', 0) + ' pts'], cta:'\u2014 tap to continue \u2014',
      next:() => { mode = 'menu'; } };
  }
}
function dockStep(dt) {
  const ctl = driveInput();
  const maxF = dboat.y < NOWAKE_Y ? 70 : 175;
  driveBoat(dboat, dt, ctl, maxF, 70);
  dboat.x += Math.sin(waveT*0.9 + dboat.y*0.02) * (dock.level-1) * 20 * dt;  // current
  dboat.x = clamp(dboat.x, 20, W-20); dboat.y = clamp(dboat.y, 40, H-30);
  dboat.wake = pushWake(dboat.wake, dboat.x - Math.cos(dboat.a)*24, dboat.y - Math.sin(dboat.a)*24, dboat.sp);
  if (dock.invuln > 0) dock.invuln -= dt;
  if (dock.shake > 0) dock.shake -= dt*3;
  const bx = dboat.x + Math.cos(dboat.a)*24, by = dboat.y + Math.sin(dboat.a)*24;
  for (const g of dock.gatesArr) {
    if (!g.passed && Math.abs(by - g.y) < 14 && Math.abs(bx - g.x) < g.w/2) {
      g.passed = true; dock.g++; dock.score += 250; sndGate();
    }
  }
  if (by < DOCK_Y + 6) {
    const s = dock.slip, inSlip = Math.abs(bx - s.cx) < s.w/2 - 8;
    if (inSlip && by < DOCK_Y - 14) {
      const cb = Math.round(500 * (1 - Math.abs(bx - s.cx)/(s.w/2)));
      const secs = (performance.now() - dock.startT)/1000;
      const tb = Math.max(0, Math.round(600 - secs*8));
      dock.score += 1000 + cb + tb + dock.g*250;
      const best = store.get('tbb-best-dock', 0);
      if (dock.score > best) store.set('tbb-best-dock', dock.score);
      sndDock();
      ovl = { title:'DOCKED! \u2693', lines:['Level ' + dock.level + ' complete', 'Score: ' + dock.score + ' pts',
        '', 'Next slip is narrower...'], cta:'\u2014 tap for level ' + (dock.level+1) + ' \u2014',
        next:() => { dock.level++; dock.g = 0; dock.startT = performance.now(); dockNewLevel(); } };
      return;
    } else if (!inSlip) { dockHit(); return; }
  }
  for (const b of dock.boats) {
    if (Math.hypot(dboat.x - b.x, dboat.y - b.y) < b.r + 16) { dockHit(); break; }
  }
}
function drawMarina() {
  const gy = DOCK_Y, s = dock.slip;
  ctx.fillStyle = '#6b5138'; ctx.fillRect(0, 0, W, gy-14);
  ctx.fillStyle = '#5d4730';
  for (let x = 0; x < W; x += 26) ctx.fillRect(x, 0, 3, gy-14);
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1;
  for (let y = 9; y < gy-14; y += 13) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let x = 30; x < W; x += 60) {
    ctx.fillStyle = '#3a2c1e'; rr(x-7, gy-28, 14, 28, 5); ctx.fill();
    ctx.strokeStyle = '#8a6f4d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x-7, gy-19); ctx.lineTo(x+7, gy-19); ctx.stroke();
  }
  const lx1 = s.cx - s.w/2, rx0 = s.cx + s.w/2;
  ctx.fillStyle = '#2f2418';
  ctx.fillRect(0, gy-14, lx1, 16); ctx.fillRect(rx0, gy-14, W-rx0, 16);
  ctx.fillStyle = '#4c3b28';
  ctx.fillRect(lx1-9, gy-14, 11, 68); ctx.fillRect(rx0-2, gy-14, 11, 68);
  for (const fx of [lx1-4, rx0+4]) {
    ctx.fillStyle = '#161616'; ctx.beginPath(); ctx.arc(fx, gy+36, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#383838'; ctx.beginPath(); ctx.arc(fx, gy+36, 4, 0, 7); ctx.fill();
  }
  const pulse = .5 + .5*Math.sin(waveT*4);
  ctx.fillStyle = 'rgba(120,255,170,' + (.22 + pulse*.22).toFixed(2) + ')';
  ctx.fillRect(lx1, gy-14, rx0-lx1, 64);
  ctx.fillStyle = '#7dffaa'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('\u25BC SLIP \u25BC', s.cx, gy-24);
}
function dockDraw() {
  ctx.save();
  if (dock.shake > 0) ctx.translate((Math.random()-.5)*10*dock.shake, (Math.random()-.5)*10*dock.shake);
  drawWater();
  // no-wake line
  ctx.save();
  ctx.strokeStyle = 'rgba(255,210,120,.55)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.moveTo(14, NOWAKE_Y); ctx.lineTo(W-14, NOWAKE_Y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,210,120,.85)'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('\u2014 NO WAKE ZONE \u2014', W/2, NOWAKE_Y - 8);
  ctx.restore();
  drawMarina();
  for (const g of dock.gatesArr) {
    if (g.passed) continue;
    drawBuoy(g.x - g.w/2, g.y, '#e05555');
    drawBuoy(g.x + g.w/2, g.y, '#3fae5a');
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(g.x - g.w/2, g.y); ctx.lineTo(g.x + g.w/2, g.y); ctx.stroke();
    ctx.setLineDash([]);
  }
  for (const b of dock.boats) {
    ctx.save(); ctx.translate(b.x, b.y + Math.sin(waveT*1.5 + b.x)*3);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(3, 5, b.r, b.r*.55, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e6ecf2';
    ctx.beginPath(); ctx.ellipse(0, 0, b.r, b.r*.55, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#31435c'; rr(-b.r*.5, -b.r*.32, b.r, b.r*.4, 6); ctx.fill();
    ctx.restore();
  }
  drawWake(dboat.wake);
  const flash = dock.invuln > 0;
  drawBoat(Object.assign({}, dboat, { flash }), '#e8a33d');
  drawControls();
  // HUD
  ctx.fillStyle = 'rgba(4,14,26,.65)'; rr(10, 10, 150, 64, 10); ctx.fill();
  ctx.fillStyle = '#cfe8ff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('LEVEL ' + dock.level, 22, 33);
  ctx.fillStyle = '#ffd76a';
  ctx.fillText(dock.score + ' pts', 22, 55);
  ctx.font = '18px sans-serif';
  ctx.fillText('\u2764'.repeat(dock.hull) + '\uD83D\uDDA4'.repeat(3 - dock.hull), W-96, 36);
  ctx.fillStyle = '#9fc3e0'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('BEST ' + store.get('tbb-best-dock', 0), W-14, 60);
  ctx.restore();
  vignette();
}

/* ---------- RACE ---------- */
const NG = 10, RLAPS = 2;
const race = { phase:'count', t:0, lastN:-1, boats:[], startT:0, over:false, overT:0 };
function gatePos(i) {
  const th = -Math.PI/2 + (i/NG)*TAU;
  return { x:240 + 160*Math.cos(th), y:320 - 230*Math.sin(th) };
}
function raceStart() {
  mode = 'race'; race.phase = 'count'; race.t = 0; race.lastN = -1; race.over = false;
  race.boats = [];
  const cols = ['#e8a33d', '#e05555', '#55b5e0', '#8fe07a'];
  for (let k = 0; k < 4; k++) {
    const g0 = gatePos(0);
    race.boats.push({
      x:g0.x - 54 + (k%2)*36, y:g0.y + 46 + Math.floor(k/2)*34,
      a:-Math.PI/2, sp:0, wake:[], color:cols[k], ai:k > 0,
      gate:1, lap:1, fin:0, prog:0, maxF:k === 0 ? 265 : 226 + k*8
    });
  }
}
function aiCtl(b) {
  const g = gatePos(b.gate % NG);
  const d = angDiff(b.a, Math.atan2(g.y - b.y, g.x - b.x));
  return { left:d < -0.1, right:d > 0.1, fwd:Math.abs(d) < 1.1, rev:false };
}
function raceStep(dt) {
  if (race.phase === 'count') {
    race.t += dt;
    const n = Math.ceil(3.2 - race.t);
    if (n !== race.lastN) { race.lastN = n; if (n > 0) sndCount(); else sndGo(); }
    if (race.t >= 3.2) { race.phase = 'run'; race.startT = performance.now(); }
    return;
  }
  const pb = race.boats[0];
  driveBoat(pb, dt, driveInput(), pb.maxF, 60);
  for (let k = 1; k < 4; k++) {
    const b = race.boats[k];
    driveBoat(b, dt, aiCtl(b), b.maxF + (b.prog < pb.prog ? 16 : 0), 60);
  }
  for (const b of race.boats) {
    b.x = clamp(b.x, 16, W-16); b.y = clamp(b.y, 16, H-16);
    b.wake = pushWake(b.wake, b.x - Math.cos(b.a)*24, b.y - Math.sin(b.a)*24, b.sp);
    const g = gatePos(b.gate % NG);
    if (Math.hypot(b.x - g.x, b.y - g.y) < 50) {
      b.gate++;
      if (b.gate % NG === 0) { b.lap++; if (b === pb) sndGate(); }
      if (b.lap > RLAPS && !b.fin) b.fin = (performance.now() - race.startT)/1000;
    }
    const ng = gatePos(b.gate % NG);
    b.prog = b.lap*100000 + b.gate*1000 - Math.hypot(b.x - ng.x, b.y - ng.y);
  }
  for (let i = 0; i < 4; i++) for (let j = i+1; j < 4; j++) {
    const a = race.boats[i], b = race.boats[j];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 34 && d > 0.1) {
      const nx = (b.x-a.x)/d, ny = (b.y-a.y)/d, push = (34-d)/2;
      a.x -= nx*push; a.y -= ny*push; b.x += nx*push; b.y += ny*push;
      a.sp *= .8; b.sp *= .8;
      if (i === 0) sndHit();
    }
  }
  if (pb.fin && !race.over) {
    const now = performance.now();
    const allFin = race.boats.every(b => b.fin);
    if (allFin || (now - race.startT)/1000 - pb.fin > 9) {
      race.over = true;
      const order = [...race.boats].sort((a, b2) =>
        (a.fin && b2.fin) ? a.fin - b2.fin : b2.prog - a.prog);
      const place = order.indexOf(pb) + 1;
      const prev = store.get('tbb-best-race', 0);
      if (!prev || place < prev) store.set('tbb-best-race', place);
      sndDock();
      ovl = { title: place === 1 ? '\uD83C\uDFC6 VICTORY!' : ord(place).toUpperCase() + ' PLACE',
        lines:['Time: ' + pb.fin.toFixed(1) + 's', 'Best finish: ' + ord(store.get('tbb-best-race', 0)),
          'Rivals: ' + order.filter(b => b !== pb).map(b => b.fin ? b.fin.toFixed(1) + 's' : 'DNF').join('  ')],
        cta:'\u2014 tap to continue \u2014', next:() => { mode = 'menu'; } };
    }
  }
}
function raceDraw() {
  drawWater();
  // course buoys
  for (let i = 0; i < NG; i++) {
    const g = gatePos(i);
    drawBuoy(g.x, g.y, i % 2 ? '#3fae5a' : '#e05555');
  }
  // start line
  const s0 = gatePos(0);
  ctx.save(); ctx.translate(s0.x, s0.y); ctx.rotate(Math.PI/2);
  for (let rI = 0; rI < 2; rI++) for (let cI = 0; cI < 8; cI++) {
    ctx.fillStyle = (rI + cI) % 2 ? '#111' : '#f4f4f4';
    ctx.fillRect(-40 + cI*10, -10 + rI*10, 10, 10);
  }
  ctx.restore();
  const order = [...race.boats].sort((a, b) => b.prog - a.prog);
  for (const b of order.slice().reverse()) { drawWake(b.wake); drawBoat(b, b.color); }
  drawControls();
  // HUD
  const pb = race.boats[0];
  const place = order.indexOf(pb) + 1;
  ctx.fillStyle = 'rgba(4,14,26,.65)'; rr(10, 10, 170, 64, 10); ctx.fill();
  ctx.fillStyle = '#cfe8ff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('LAP ' + Math.min(pb.lap, RLAPS) + '/' + RLAPS + '   ' + ord(place).toUpperCase(), 22, 33);
  ctx.fillStyle = '#ffd76a';
  const t = race.phase === 'run' ? (performance.now() - race.startT)/1000 : 0;
  ctx.fillText(t.toFixed(1) + 's', 22, 55);
  ctx.fillStyle = '#9fc3e0'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('BEST ' + (store.get('tbb-best-race', 0) ? ord(store.get('tbb-best-race', 0)) : '\u2014'), W-14, 34);
  if (race.phase === 'count') {
    const n = Math.ceil(3.2 - race.t);
    ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 84px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(n > 0 ? n : 'GO!', W/2, H/2);
    if (n <= 0) sndGo();
  }
  vignette();
}

/* ---------- FISHING ---------- */
const FISH = [
  { n:'Spotted Seatrout', p:10, w:.42 }, { n:'Redfish', p:25, w:.28 },
  { n:'Snook', p:50, w:.19 }, { n:'Tarpon', p:100, w:.11 }
];
const fish = { st:'idle', bob:null, biteAt:0, hookBy:0, dist:0, tension:0, nextSurge:0,
  cur:null, total:0, msg:'Tap the water to cast', snapT:0, caughtT:0 };
function fishStart() {
  mode = 'fish';
  fish.st = 'idle'; fish.bob = null; fish.cur = null; fish.total = 0;
  fish.msg = 'Tap the water to cast';
}
function pickFish() {
  const r = Math.random(); let a = 0;
  for (const f of FISH) { a += f.w; if (r < a) return f; }
  return FISH[0];
}
function fishTap(p) {
  if (!p || fish.st !== 'idle' && fish.st !== 'bite') return;
  if (fish.st === 'idle') {
    const tx = clamp(p.x, 40, W-40), ty = clamp(p.y, 230, H-170);
    fish.bob = { x:240, y:452, tx, ty, t:0 };
    fish.st = 'cast'; sndSplash();
  } else if (fish.st === 'bite') {
    fish.st = 'fight'; fish.cur = pickFish();
    fish.dist = 100; fish.tension = 25;
    fish.nextSurge = performance.now() + 1200 + Math.random()*1200;
    sndCatch();
  }
}
function fishStep(dt) {
  const now = performance.now();
  if (fish.st === 'cast') {
    const b = fish.bob; b.t += dt*1.7;
    if (b.t >= 1) {
      b.t = 1; fish.st = 'wait';
      fish.biteAt = now + 2000 + Math.random()*4000;
      fish.msg = 'Waiting for a bite...';
    }
  } else if (fish.st === 'wait') {
    if (now >= fish.biteAt) { fish.st = 'bite'; fish.hookBy = now + 1400; beep(1200,.2,'square',.1); }
  } else if (fish.st === 'bite') {
    if (now > fish.hookBy) { fish.st = 'idle'; fish.bob = null; fish.msg = 'It got away...'; }
  } else if (fish.st === 'fight') {
    const reeling = held('reel') || keyDown(' ', 'arrowup', 'w');
    if (reeling) { fish.dist -= 32*dt; fish.tension += 52*dt; }
    else fish.tension -= 42*dt;
    fish.tension = clamp(fish.tension, 0, 100);
    if (now >= fish.nextSurge) {
      fish.nextSurge = now + 1200 + Math.random()*1200;
      fish.tension = Math.min(100, fish.tension + 22);
      fish.dist = Math.min(100, fish.dist + 7);
      sndSplash();
    }
    if (fish.tension >= 100) {
      fish.st = 'snap'; fish.snapT = now; fish.bob = null;
      fish.msg = 'Line snapped!'; sndOver();
    } else if (fish.dist <= 0) {
      fish.st = 'caught'; fish.caughtT = now; fish.total += fish.cur.p;
      const best = store.get('tbb-best-fish', 0);
      if (fish.total > best) store.set('tbb-best-fish', fish.total);
      sndCatch();
    }
  } else if (fish.st === 'snap' && now - fish.snapT > 1400) {
    fish.st = 'idle'; fish.msg = 'Tap the water to cast';
  } else if (fish.st === 'caught' && now - fish.caughtT > 2200) {
    fish.st = 'idle'; fish.bob = null; fish.msg = 'Tap the water to cast';
  }
}
function fishDraw() {
  drawWater();
  // boat with rod
  const bb = { x:240, y:500, a:-Math.PI/2, sp:0 };
  drawBoat(bb, '#e8a33d');
  const rodX = 240, rodY = 478;
  ctx.strokeStyle = '#5a3d22'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(rodX, rodY); ctx.lineTo(rodX + 44, rodY - 66); ctx.stroke();
  const tipX = rodX + 44, tipY = rodY - 66;
  if (fish.bob) {
    const b = fish.bob;
    let bx, by;
    if (fish.st === 'cast') {
      const t = b.t, mx = (b.x + b.tx)/2, my = Math.min(b.y, b.ty) - 90;
      bx = (1-t)*(1-t)*b.x + 2*(1-t)*t*mx + t*t*b.tx;
      by = (1-t)*(1-t)*b.y + 2*(1-t)*t*my + t*t*b.ty;
    } else { bx = b.tx; by = b.ty; }
    ctx.strokeStyle = 'rgba(240,240,240,.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(bx, by); ctx.stroke();
    const dip = fish.st === 'bite' ? Math.sin(waveT*30)*4 + 4 : Math.sin(waveT*2)*2;
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(bx+2, by+3, 9, 4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e05555'; ctx.beginPath(); ctx.arc(bx, by + dip, 8, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#f4f4f4'; ctx.beginPath(); ctx.arc(bx, by + dip, 8, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    for (let rI = 1; rI <= 2; rI++) {
      ctx.beginPath(); ctx.arc(bx, by, 12 + ((waveT*20 + rI*14) % 28), 0, 7); ctx.stroke();
    }
    if (fish.st === 'bite') {
      ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('!', bx, by - 34 - Math.sin(waveT*14)*5);
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('TAP!', bx, by - 56);
    }
    if (fish.st === 'fight') {
      // tension bar
      ctx.fillStyle = 'rgba(4,14,26,.7)'; rr(W/2-110, 120, 220, 20, 10); ctx.fill();
      const tw = 216 * fish.tension/100;
      ctx.fillStyle = fish.tension > 75 ? '#e05555' : fish.tension > 45 ? '#e8a33d' : '#3fae5a';
      if (tw > 4) { rr(W/2-107, 123, tw, 14, 7); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('TENSION', W/2, 112);
      // distance bar
      ctx.fillStyle = 'rgba(4,14,26,.7)'; rr(W/2-110, 150, 220, 14, 7); ctx.fill();
      ctx.fillStyle = '#55b5e0';
      const dw = 216 * (1 - fish.dist/100);
      if (dw > 4) { rr(W/2-107, 152, dw, 10, 5); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif';
      ctx.fillText(fish.cur.n.toUpperCase() + '  \u2014  HOLD REEL, WATCH TENSION', W/2, 178);
    }
  }
  if (fish.st === 'caught' && fish.cur) {
    ctx.textAlign = 'center';
    ctx.font = '64px sans-serif';
    ctx.fillText('\uD83D\uDC1F', W/2, 330 + Math.sin(waveT*6)*8);
    ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 24px sans-serif';
    ctx.fillText('Caught a ' + fish.cur.n + '!', W/2, 380);
    ctx.fillStyle = '#7dffaa'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText('+' + fish.cur.p + ' pts', W/2, 408);
  }
  // HUD
  ctx.fillStyle = 'rgba(4,14,26,.65)'; rr(10, 10, 150, 60, 10); ctx.fill();
  ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(fish.total + ' pts', 22, 35);
  ctx.fillStyle = '#9fc3e0'; ctx.font = '12px sans-serif';
  ctx.fillText('BEST ' + store.get('tbb-best-fish', 0), 22, 56);
  // done button
  uiButtons.push({ id:'done', x:W-96, y:12, w:84, h:36, tap:() => { mode = 'menu'; } });
  ctx.fillStyle = 'rgba(10,30,52,.7)'; rr(W-96, 12, 84, 36, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(143,208,240,.6)'; ctx.lineWidth = 2; rr(W-96, 12, 84, 36, 18); ctx.stroke();
  ctx.fillStyle = '#cfe8ff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Done', W-54, 35);
  // reel button during fight
  if (fish.st === 'fight') {
    uiButtons.push({ id:'reel', c:1, x:W/2, y:648, r:48 });
    const on = held('reel');
    ctx.fillStyle = on ? 'rgba(143,208,240,.9)' : 'rgba(10,30,52,.66)';
    ctx.beginPath(); ctx.arc(W/2, 648, 48, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(143,208,240,.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(W/2, 648, 48, 0, 7); ctx.stroke();
    ctx.fillStyle = on ? '#0a2540' : '#cfe8ff';
    ctx.font = 'bold 19px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('REEL', W/2, 655);
  }
  // message
  if (fish.st !== 'fight') {
    ctx.fillStyle = 'rgba(220,238,252,.9)'; ctx.font = '15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(fish.msg, W/2, H - 30);
  }
  vignette();
}

/* ---------- tap routing / main loop ---------- */
function uiTap(p) {
  if (ovl) { const n = ovl.next; ovl = null; if (n) n(); return; }
  if (mode === 'fish') fishTap(p);
}
function step(dt) {
  if (mode === 'dock') dockStep(dt);
  else if (mode === 'race') raceStep(dt);
  else if (mode === 'fish') fishStep(dt);
}
function draw() {
  uiButtons = [];
  ctx.save();
  if (mode === 'menu') menuDraw();
  else if (mode === 'dock') dockDraw();
  else if (mode === 'race') raceDraw();
  else if (mode === 'fish') fishDraw();
  ctx.restore();
  if (ovl) { uiButtons = []; overlay(ovl.title, ovl.lines, ovl.cta); }
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last)/1000); last = now; waveT += dt;
  if (!ovl) step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
