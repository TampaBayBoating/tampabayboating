<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{font-family:sans-serif;padding:20px}.map-filter{border:1px solid #ccc;background:#fff;border-radius:999px;padding:6px 14px;margin:3px;cursor:pointer}.map-filter.active{background:#0a2540;color:#fff}#bay-leaflet-map{height:480px;border:1px solid #ccc}</style>
</head><body>
<h2>Isolated map test</h2>
<div><button class="map-filter active" data-cat="all">All</button><button class="map-filter" data-cat="fuel">Fuel</button><button class="map-filter" data-cat="bait">Bait</button></div>
<div id="bay-leaflet-map"></div>
<script>
const MAP_PINS = [["Port32 Tampa","fuel",27.88621,-82.5338,"5200 W Tyson Ave, Tampa","(813) 831-1200","Ethanol-free Rec 90 + diesel, ship's store"],["Marjorie Park Yacht Basin","fuel",27.92413,-82.45272,"Davis Islands, Tampa","","Temporarily closed as of Oct 2026 \u2014 call before heading over"],["St. Petersburg Municipal Marina","fuel",27.76996,-82.63116,"Downtown St. Pete","(727) 893-7329","Non-ethanol 90 octane, ValvTect gas & diesel"]];
const MAP_COLORS = {fuel:"#e25822", bait:"#2e9e5b", dine:"#8b5cf6", play:"#0e7490", club:"#d946ef", storage:"#f59e0b"};
window.tbbMapInit=(function(){
  var done=false;
  return function(){
  if(done) return; done=true;
  const el = document.getElementById('bay-leaflet-map');
  if(!el || typeof L === 'undefined') return;
  const map = window.tbbMap = L.map('bay-leaflet-map').setView([27.85, -82.55], 10);
  const chartBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {maxZoom: 18, attribution: 'Esri, GEBCO, NOAA, NGS, OSU'}).addTo(map);
  const streetBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'});
  const seamarks = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {maxZoom: 18, attribution: 'Seamarks &copy; <a href="https://www.openseamap.org">OpenSeaMap</a> contributors'}).addTo(map);
  L.control.layers({'🗺️ Navigation chart': chartBase, '🛣️ Street map': streetBase}, {'🚩 Chart marks (buoys, beacons, lights)': seamarks}, {collapsed: false}).addTo(map);
  const layer = L.layerGroup().addTo(map);
  function draw(cat){
    layer.clearLayers();
    MAP_PINS.filter(p => cat==='all' || p[1]===cat).forEach(p => {
      const m = L.circleMarker([p[2], p[3]], {radius: 8, color: '#fff', weight: 2, fillColor: MAP_COLORS[p[1]]||'#666', fillOpacity: .95});
      let html = '<b>'+p[0]+'</b>';
      if(p[4]) html += '<br>'+p[4];
      if(p[6]) html += '<br><i>'+p[6]+'</i>';
      if(p[5]) html += '<br><a href="tel:'+p[5].replace(/[^0-9]/g,'')+'">'+p[5]+'</a>';
      m.bindPopup(html);
      layer.add(m);
    });
  }
  draw('all');
  document.querySelectorAll('.map-filter').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.map-filter').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    draw(b.dataset.cat);
  }));
  setTimeout(function(){ map.invalidateSize(); }, 120);
  };
})();
tbbMapInit();
</script></body></html>
