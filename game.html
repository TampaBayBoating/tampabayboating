<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1a2f">
<title>Dock It! — Got Time to Kill? | Tampa Bay Boating</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0a1a2f; overflow:hidden; touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; }
  canvas { display:block; border-radius:12px; box-shadow:0 8px 40px rgba(0,0,0,.5); touch-action:none; }
  #back { position:absolute; top:10px; left:10px; z-index:5; background:rgba(6,20,38,.72); color:#cfe8ff;
    border:1px solid rgba(140,200,255,.35); border-radius:20px; padding:8px 14px; font-size:14px;
    text-decoration:none; backdrop-filter:blur(4px); }
</style>
</head>
<body>
<div id="wrap">
  <a id="back" href="index.html">‹ Tampa Bay Boating</a>
  <canvas id="game" width="480" height="720"></canvas>
</div>
<script>
"use strict";
/* DOCK IT! — a tiny Tampa Bay Boating game.
   Steer the boat into the slip. Don't hit the docks. */

const W = 480, H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fit() {
  const pad = 8;
  const s = Math.min((innerWidth - pad*2) / W, (innerHeight - pad*2) / H);
  canvas.style.width = (W*s) + 'px';
  canvas.style.height = (H*s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- audio (tiny beeps) ---------- */
let AC = null;
function beep(freq, dur, type, vol, when) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .12, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch(e) {}
}
const sndGate = () => { beep(880,.12,'sine',.10); beep(1320,.15,'sine',.08,.09); };
const sndHit  = () => beep(140,.25,'sawtooth',.14);
const sndDock = () => { beep(523,.12,'triangle',.12); beep(659,.12,'triangle',.12,.1); beep(784,.2,'triangle',.12,.2); };
const sndOver = () => { beep(330,.2,'triangle',.12); beep(220,.35,'triangle',.12,.18); };

/* ---------- input ---------- */
const keys = { left:false, right:false };
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  tap();
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});
/* drag-to-steer: the boat follows your finger (or mouse) */
let pointer = null;
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H,
           t: performance.now() };
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
  pointer = toGame(e);
  tap();
});
canvas.addEventListener('pointermove', e => { if (pointer) pointer = toGame(e); });
const endPointer = () => { pointer = null; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- game state ---------- */
let state = 'title';           // title | play | docked | over
let level = 1, hull = 3, score = 0, gates = 0, startT = 0, dockT = 0;
let best = 0;
try { best = +(localStorage.getItem('tbb-dockit-best') || 0); } catch(e) {}
function saveBest() { try { localStorage.setItem('tbb-dockit-best', best); } catch(e) {} }
let invuln = 0, shake = 0, waveT = 0;
let slip = { cx: W/2, w: 110 };
let boats = [];   // anchored obstacles {x,y,r}
let gatesArr = []; // {x, y, w, passed}
let wake = [];

const boat = { x: W/2, y: H-90, a: -Math.PI/2, sp: 0 };

function resetBoat() {
  boat.x = W/2; boat.y = H - 90; boat.a = -Math.PI/2; boat.sp = 0;
  wake = [];
}

function newLevel() {
  slip.w = Math.max(62, 112 - (level-1)*9);
  slip.cx = 130 + Math.random() * (W - 260);
  boats = [];
  const n = Math.min(2 + level, 6);
  for (let i = 0; i < n; i++) {
    let x, y, ok, tries = 0;
    do {
      ok = true;
      x = 50 + Math.random() * (W - 100);
      y = 200 + Math.random() * (H - 340);
      if (Math.abs(x - W/2) < 70 && y > H - 260) ok = false;      // keep start clear
      for (const b of boats) if (Math.hypot(b.x-x, b.y-y) < 110) ok = false;
      tries++;
    } while (!ok && tries < 40);
    boats.push({ x, y, r: 24 + Math.random()*8, hue: Math.random() });
  }
  gatesArr = [];
  for (let i = 0; i < 3; i++) {
    const y = 560 - i*130;
    const x = 110 + Math.random() * (W - 220);
    gatesArr.push({ x, y, w: 120, passed:false });
  }
  resetBoat();
  invuln = 0;
}

function startGame() {
  level = 1; hull = 3; score = 0; gates = 0;
  startT = performance.now();
  newLevel();
  state = 'play';
}

function tap() {
  if (state === 'title') startGame();
  else if (state === 'docked') { level++; newLevel(); startT = performance.now(); gates = 0; state = 'play'; }
  else if (state === 'over') { startGame(); }
}

/* ---------- physics ---------- */
const DOCK_Y = 96;          // dock wall line
const NOWAKE_Y = 250;       // no-wake zone boundary

function step(dt) {
  waveT += dt;
  // steering: follow the pointer, or arrow keys
  if (pointer) {
    let des = Math.atan2(pointer.y - boat.y, pointer.x - boat.x);
    des = Math.max(-Math.PI*0.92, Math.min(-Math.PI*0.08, des)); // keep heading forward
    let d = des - boat.a;
    while (d > Math.PI) d -= 2*Math.PI;
    while (d < -Math.PI) d += 2*Math.PI;
    const maxTurn = 3.6 * dt;
    boat.a += Math.max(-maxTurn, Math.min(maxTurn, d));
  } else {
    const turn = 3.2 * dt;
    if (keys.left) boat.a -= turn;
    if (keys.right) boat.a += turn;
    boat.a = Math.max(-Math.PI*0.92, Math.min(-Math.PI*0.08, boat.a));
  }

  // speed: cruise, slower in no-wake zone
  const targetSp = boat.y < NOWAKE_Y ? 55 : 120;
  boat.sp += (targetSp - boat.sp) * Math.min(1, dt*2.5);

  // current pushes sideways, stronger each level
  const current = Math.sin(waveT*0.9 + boat.y*0.02) * (level-1) * 22;

  const nx = boat.x + Math.cos(boat.a) * boat.sp * dt + current * dt;
  const ny = boat.y + Math.sin(boat.a) * boat.sp * dt;
  boat.x = Math.max(20, Math.min(W-20, nx));
  boat.y = Math.max(40, Math.min(H-30, ny));

  // wake trail
  if (Math.random() < .5) wake.push({ x:boat.x - Math.cos(boat.a)*20, y:boat.y - Math.sin(boat.a)*20, l:1 });
  for (const p of wake) p.l -= dt*1.2;
  wake = wake.filter(p => p.l > 0);

  if (invuln > 0) invuln -= dt;
  if (shake > 0) shake -= dt*3;

  const bx = boat.x + Math.cos(boat.a)*22;  // bow
  const by = boat.y + Math.sin(boat.a)*22;

  // gates
  for (const g of gatesArr) {
    if (!g.passed && Math.abs(by - g.y) < 14 && Math.abs(bx - g.x) < g.w/2) {
      g.passed = true; gates++; score += 250; sndGate();
    }
  }

  // dock wall collision (top), except through the slip
  if (by < DOCK_Y + 6) {
    const inSlip = Math.abs(bx - slip.cx) < slip.w/2 - 8;
    if (inSlip && by < DOCK_Y - 14) {
      // DOCKED!
      const centerBonus = Math.round(500 * (1 - Math.abs(bx - slip.cx) / (slip.w/2)));
      const secs = (performance.now() - startT) / 1000;
      const timeBonus = Math.max(0, Math.round(600 - secs*8));
      const pts = 1000 + centerBonus + timeBonus + gates*250;
      score += pts; dockT = performance.now();
      if (score > best) { best = score; saveBest(); }
      state = 'docked'; sndDock();
      return;
    } else if (!inSlip) {
      hitWall();
      return;
    }
  }

  // anchored boats
  for (const b of boats) {
    if (Math.hypot(boat.x - b.x, boat.y - b.y) < b.r + 16) { hitWall(); break; }
  }
}

function hitWall() {
  if (invuln > 0) return;
  hull--; invuln = 1.2; shake = 1;
  sndHit();
  // bounce back down
  boat.y += 46;
  boat.a = -Math.PI/2 + (Math.random()-.5)*.4;
  boat.sp = 40;
  if (hull <= 0) {
    if (score > best) { best = score; saveBest(); }
    state = 'over'; sndOver();
  }
}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawWater() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d2b4d'); g.addColorStop(.55, '#0e3a5f'); g.addColorStop(1, '#0a2a4a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // animated wave lines
  ctx.lineWidth = 2;
  for (let k = 0; k < 4; k++) {
    ctx.strokeStyle = `rgba(120,190,240,${.10 - k*.02})`;
    ctx.beginPath();
    const yb = 140 + k*150;
    for (let x = 0; x <= W; x += 8) {
      const y = yb + Math.sin(x*0.03 + waveT*(1.2+k*.25) + k*2) * 9;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // no-wake zone
  ctx.save();
  ctx.strokeStyle = 'rgba(255,210,120,.55)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.moveTo(14, NOWAKE_Y); ctx.lineTo(W-14, NOWAKE_Y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,210,120,.8)'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('— NO WAKE ZONE —', W/2, NOWAKE_Y - 8);
  ctx.restore();
}

function drawMarina() {
  // deck
  ctx.fillStyle = '#5a4632';
  ctx.fillRect(0, 0, W, DOCK_Y - 14);
  ctx.fillStyle = '#6b543c';
  for (let x = 0; x < W; x += 24) ctx.fillRect(x, 0, 3, DOCK_Y - 14); // planks
  // dock wall (pilings) with slip gap
  const gy = DOCK_Y;
  ctx.fillStyle = '#3d2f21';
  const lx0 = 0, lx1 = slip.cx - slip.w/2, rx0 = slip.cx + slip.w/2, rx1 = W;
  ctx.fillRect(lx0, gy - 14, lx1 - lx0, 16);
  ctx.fillRect(rx0, gy - 14, rx1 - rx0, 16);
  // slip finger piers
  ctx.fillStyle = '#4c3b28';
  ctx.fillRect(lx1 - 8, gy - 14, 10, 64);
  ctx.fillRect(rx0 - 2, gy - 14, 10, 64);
  // glowing slip marker
  const pulse = .5 + .5*Math.sin(waveT*4);
  ctx.fillStyle = `rgba(120,255,170,${.25 + pulse*.25})`;
  ctx.fillRect(lx1, gy - 14, rx0 - lx1, 60);
  ctx.fillStyle = '#7dffaa'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('▼ SLIP ▼', slip.cx, gy - 22);
  // cleats
  ctx.fillStyle = '#222';
  for (let x = 20; x < W; x += 60) { ctx.beginPath(); ctx.arc(x, gy - 6, 4, 0, 7); ctx.fill(); }
}

function drawGates() {
  for (const g of gatesArr) {
    if (g.passed) continue;
    // green right, red left
    ctx.fillStyle = '#e33';
    ctx.beginPath(); ctx.arc(g.x - g.w/2, g.y, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#2d2';
    ctx.beginPath(); ctx.arc(g.x + g.w/2, g.y, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(g.x - g.w/2, g.y); ctx.lineTo(g.x + g.w/2, g.y); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawBoats() {
  for (const b of boats) {
    ctx.save(); ctx.translate(b.x, b.y + Math.sin(waveT*1.5 + b.x)*3);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(3, 5, b.r, b.r*0.55, 0, 0, 7); ctx.fill();
    ctx.fillStyle = b.hue > .5 ? '#dde7f0' : '#f0e2d2';
    ctx.beginPath(); ctx.ellipse(0, 0, b.r, b.r*0.55, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#31435c';
    rr(-b.r*0.5, -b.r*0.32, b.r, b.r*0.4, 6); ctx.fill();
    ctx.restore();
  }
}

function drawPlayer() {
  for (const p of wake) {
    ctx.fillStyle = `rgba(180,220,250,${p.l*.35})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 8*(1-p.l)+3, 0, 7); ctx.fill();
  }
  ctx.save();
  ctx.translate(boat.x, boat.y + Math.sin(waveT*3)*1.5);
  ctx.rotate(boat.a + Math.PI/2);
  if (invuln > 0 && Math.floor(waveT*12) % 2 === 0) ctx.globalAlpha = .35;
  // hull
  ctx.fillStyle = '#f2f6fa';
  rr(-13, -23, 26, 46, 10); ctx.fill();
  ctx.fillStyle = '#16324f';
  rr(-13, -23, 26, 10, 6); ctx.fill();
  // stripe
  ctx.fillStyle = '#e8a33d'; ctx.fillRect(-13, 2, 26, 4);
  // windshield
  ctx.fillStyle = '#9fd4ef'; rr(-8, -14, 16, 10, 4); ctx.fill();
  // motor
  ctx.fillStyle = '#222'; ctx.fillRect(-5, 23, 10, 8);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = 'rgba(4,14,26,.65)';
  rr(10, 10, 150, 64, 10); ctx.fill();
  ctx.fillStyle = '#cfe8ff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('LEVEL ' + level, 22, 33);
  ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 15px sans-serif';
  ctx.fillText(score + ' pts', 22, 55);
  // hull hearts
  ctx.font = '18px sans-serif';
  ctx.fillText('❤'.repeat(hull) + '🖤'.repeat(3 - hull), W - 92, 34);
  ctx.fillStyle = '#9fc3e0'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('BEST ' + best, W - 14, 58);
  // steer hints
  if (state === 'play') {
    ctx.fillStyle = 'rgba(207,232,255,.5)'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    const showHint = (performance.now() - startT) < 6000;
    if (showHint) {
      ctx.fillText('drag to steer', W/2, H - 24);
    }
  }
}

function overlay(title, lines, cta) {
  ctx.fillStyle = 'rgba(4,12,24,.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 44px sans-serif';
  ctx.fillText(title, W/2, H/2 - 110);
  ctx.fillStyle = '#dceefc'; ctx.font = '17px sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, W/2, H/2 - 52 + i*28));
  const pulse = .6 + .4*Math.sin(waveT*5);
  ctx.fillStyle = `rgba(125,255,170,${pulse})`; ctx.font = 'bold 20px sans-serif';
  ctx.fillText(cta, W/2, H/2 + 110);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-.5)*10*shake, (Math.random()-.5)*10*shake);
  drawWater();
  if (state !== 'title') {
    drawMarina(); drawGates(); drawBoats(); drawPlayer(); drawHUD();
    // touch ripple: show where the boat is steering toward
    if (state === 'play' && pointer) {
      const age = (performance.now() - pointer.t) / 600;
      ctx.strokeStyle = 'rgba(143,208,240,.75)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 10 + age*22, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(143,208,240,.9)';
      ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 4, 0, 7); ctx.fill();
    }
  }
  ctx.restore();

  if (state === 'title') {
    drawMarina();
    overlay('DOCK IT!',
      ['Got time to kill?', '', 'Drag to steer — the boat follows', 'your finger. Slide it into the glowing slip.', 'Thread the buoys for bonus points.', 'Don\'t kiss the dock — 3 hits and', 'you\'re calling Sea Tow.'],
      '— tap to cast off —');
    if (best > 0) { ctx.fillStyle = '#9fc3e0'; ctx.font = '15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Best: ' + best + ' pts', W/2, H/2 + 150); }
  } else if (state === 'docked') {
    overlay('DOCKED! ⚓',
      ['Level ' + level + ' complete', 'Score: ' + score + ' pts', '', 'Next slip is narrower...'],
      '— tap for level ' + (level+1) + ' —');
  } else if (state === 'over') {
    overlay('HULL BREACHED!',
      ['The dock wins this round.', 'Score: ' + score + ' pts', 'Best: ' + best + ' pts'],
      '— tap to try again —');
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function loop(now) {
  let dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (state === 'play') step(dt); else waveT += dt;
  draw();
  requestAnimationFrame(loop);
}
newLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
